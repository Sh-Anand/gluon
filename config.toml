[server]
socket_path = "./gluon-sim.sock"

[sim]
# Set to >0 to enforce a hard timeout, or 0 to disable.
timeout_cycles = 0

[glug]
gluon_log_level = 2
muon_log_level = 0

# Muon core timing, shared by all SMs
[glug.core]
ibuf_depth = 4       # decoded instructions per warp available for issue

# functional units, all fully pipelined: a warp-instruction takes ceil(num_lanes / lanes)
# passes, and its rd is ready `latency` cycles after the last pass issues
[glug.core.units]
alu        = { lanes = 32, latency = 3 }
mul        = { lanes = 32, latency = 4 }
div        = { lanes = 32, latency = 37 }
fp         = { lanes = 16, latency = 5 }
fp_divsqrt = { lanes = 4,  latency = 16 }
fp_exp     = { lanes = 8,  latency = 9 }
sfu        = { lanes = 32, latency = 3 }
lsu        = { lanes = 32, latency = 10 }

# shared memory: an SM serves one request at a time, holding its banks for per_bank_latency
# per distinct word in the request's fullest bank; a load's rd is ready startup_latency after
[glug.core.smem]
banks = 32
startup_latency = 8
per_bank_latency = 1

# global memory: L0 per core for instructions, L1 per SM (the first level for data), L2 shared by
# all SMs and backed by DRAM. A miss costs
# miss_latency on top of the next level's access (the L2's includes the DRAM round trip) and
# holds the link to the next level for bus_cycles. The L1 is write-through: each store is also
# passed on to the L2, holding the L1's link for bus_cycles; the L2 writes back when it evicts
[glug.core.gmem]
line = 128 # bytes, the same at every level
l0 = { sets = 64,  ways = 1, mshrs = 4, hit_latency = 0, miss_latency = 9,  bus_cycles = 0 }
l1 = { sets = 128, ways = 4, mshrs = 8, hit_latency = 12, miss_latency = 30, bus_cycles = 0 }
l2 = { sets = 512, ways = 8, mshrs = 8, hit_latency = 15, miss_latency = 80, bus_cycles = 16 }

[[glug.sms]]
id = 0
num_cores = 4
num_warps = 8
num_lanes = 32
regs_per_core = 512
shmem = 65536

[[glug.sms]]
id = 1
num_cores = 4
num_warps = 8
num_lanes = 32
regs_per_core = 512
shmem = 65536

[intake]
command_queue_size = 4

[stream]
num_sq = 4
sq_entries = 4 

[dispatch]
kq_size = 4
mq_size = 4
csq_size = 4

[completion]
event_queue_size = 4

[engine]
num_kernel_engines = 4
num_mem_engines = 1
num_cs_engines = 1

[kernel_engine]
# kernel engine specific configuration placeholders

[mem_engine]
# memory engine specific configuration placeholders

[cs_engine]
# control/status engine specific configuration placeholders
